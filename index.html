<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이천 병원 지도 (공유 메모)</title>

<style>
html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:sans-serif;
}

/* 전체 */
#wrap{
  display:flex;
  width:100%;
  height:100%;
}

/* 왼쪽 영역 */
#topArea{
  width:340px;
  background:#fff;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
  z-index:10;
}

/* 검색 */
#searchArea{
  padding:14px;
  border-bottom:1px solid #eee;
  display:flex;
  gap:8px;
}

#keyword{
  flex:1;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#2f80ed;
  color:#fff;
  cursor:pointer;
}

/* 병원 목록 */
#hospitalList{
  flex:1;
  overflow-y:auto;
}

.hospital-item{
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.hospital-item:hover{
  background:#f5f7fa;
}

.hospital-name{
  font-weight:bold;
  margin-bottom:4px;
}

.hospital-address{
  font-size:13px;
  color:#666;
}

/* 지도 */
#map{
  flex:1;
  height:100%;
}

/* 메모 */
#memoPanel{
  width:320px;
  padding:14px;
  border-left:1px solid #ddd;
  background:#fafafa;
  box-sizing:border-box;
}

#selectedTitle{
  font-weight:bold;
  margin-bottom:8px;
}

#memo{
  width:100%;
  height:120px;
  resize:none;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  box-sizing:border-box;
}

#saveBtn{
  margin-top:10px;
  width:100%;
}

/* =========================
   모바일 UI
========================= */
@media (max-width:768px){
  html, body{
    overflow:hidden;
  }

  #wrap{
    flex-direction:column;
  }

  /* 상단 */
  #topArea{
    width:100%;
    height:230px;
    border-right:none;
    border-bottom:1px solid #ddd;
  }

  /* 검색 */
  #searchArea{
    display:flex;
    gap:8px;
    padding:10px;
    background:#fff;
  }

  #keyword{
    flex:1;
    font-size:16px;
    padding:12px;
  }

  button{
    font-size:15px;
    padding:12px 14px;
  }

  /* 목록 */
  #hospitalList{
    height:160px;
    overflow-y:auto;
    background:#fff;
  }

  .hospital-item{
    padding:14px;
  }

  .hospital-name{
    font-size:16px;
  }

  .hospital-address{
    font-size:14px;
  }

  /* 지도 */
  #map{
    flex:1;
    min-height:220px;
  }

  /* 메모 */
  #memoPanel{
    width:100%;
    border-left:none;
    border-top:1px solid #ddd;
    padding:12px;
    background:#fff;
  }

  #memo{
    height:90px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="wrap">
  <div id="topArea">
    <div id="searchArea">
      <input type="text" id="keyword" placeholder="병원 검색" />
      <button onclick="searchPlaces()">검색</button>
    </div>
    <div id="hospitalList"></div>
  </div>

  <div id="map"></div>

  <div id="memoPanel">
    <div id="selectedTitle">병원을 선택하세요</div>
    <textarea id="memo" placeholder="병원 메모 입력 (모두에게 공유됩니다)"></textarea>
    <button id="saveBtn">메모 저장</button>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4106a0cc81c61ef4889c6d4acf55a48d&libraries=services"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // TODO: 본인의 Firebase 프로젝트 설정값으로 대체하세요!
  const firebaseConfig = {
    apiKey: "AIzaSyDXygjMEH5dTXEnShy5RtEe3TNuGg4HWNo",
    authDomain: "icheonhospitalmap.firebaseapp.com",
    projectId: "icheonhospitalmap",
    storageBucket: "icheonhospitalmap.firebasestorage.app",
    messagingSenderId: "101383699939",
    appId: "1:101383699939:web:810bff2eeff22d9433b4d6",
    measurementId: "G-W85K5CQ01Y"
  };

  // Firebase 및 Firestore 초기화
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ICHEON = { lat:37.2793, lng:127.4429 };
  let map;
  let ps;
  let markers = [];
  let currentHospital = null;
  let myLocationMarker = null;

  const hospitalList = document.getElementById("hospitalList");
  const memoTextarea = document.getElementById("memo");
  const selectedTitle = document.getElementById("selectedTitle");

  /* 시작 */
  window.onload = function(){
    map = new kakao.maps.Map(
      document.getElementById("map"),
      {
        center: new kakao.maps.LatLng(ICHEON.lat, ICHEON.lng),
        level: 5
      }
    );

    ps = new kakao.maps.services.Places();
    searchPlaces();
    showMyLocation();
  };

  /* 현재 위치 보이기 */
  function showMyLocation(){
    if(!navigator.geolocation) return;

    navigator.geolocation.watchPosition(
      function(position){
        if(position.coords.accuracy > 500) return;

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const myPos = new kakao.maps.LatLng(lat, lng);

        if(!myLocationMarker){
          const markerImage = createDotMarker("#FF3B30");
          myLocationMarker = new kakao.maps.Marker({
            position: myPos,
            image: markerImage,
            zIndex: 9999
          });
          myLocationMarker.setMap(map);
        } else {
          myLocationMarker.setPosition(myPos);
        }
      },
      function(error){ console.log(error); },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
    );
  }

  /* 마커 제거 */
  function clearMarkers(){
    markers.forEach(marker => { marker.setMap(null); });
    markers = [];
  }

  /* 병원 검색 키워드 정의 */
  async function searchPlaces(){
    clearMarkers();
    hospitalList.innerHTML = "";

    const bounds = new kakao.maps.LatLngBounds();
    const added = new Set();
    const keywords = [
      "이천 병원", "이천 의원", "이천 내과", "이천 외과", "이천 정형외과", 
      "이천 신경외과", "이천 가정의학과", "이천 소아청소년과", "이천 안과", 
      "이천 산부인과", "이천 이비인후과", "이천 클리닉"
    ];

    const userKeyword = document.getElementById("keyword").value.trim().toLowerCase();

    for(const keyword of keywords){
      await searchKeyword(keyword, added, bounds, userKeyword);
    }
    map.setBounds(bounds);
  }

  /* 키워드 검색 처리 */
  function searchKeyword(keyword, added, bounds, filterKeyword){
    return new Promise((resolve) => {
      ps.keywordSearch(
        keyword,
        async function(data, status){
          if(status !== kakao.maps.services.Status.OK){
            resolve();
            return;
          }

          for (const place of data) {
            const name = place.place_name;

            // 제외 조건
            if(name.includes("약국") || name.includes("동물") || name.includes("주차장") || name.includes("장례") || name.includes("요양")){
              continue;
            }
            // 필터링
            if(filterKeyword && !name.toLowerCase().includes(filterKeyword)){
              continue;
            }
            // 중복 제거
            if(added.has(place.id)){
              continue;
            }

            added.add(place.id);
            // Firestore 조회를 위해 await 처리 가능하도록 async 함수 내부 시퀀스 유지
            await addHospital(place, bounds);
          }
          resolve();
        },
        {
          location: new kakao.maps.LatLng(ICHEON.lat, ICHEON.lng),
          radius: 10000,
          size: 15
        }
      );
    });
  }

  /* 병원 추가 및 Firestore 연동 마커 색상 결정 */
  async function addHospital(place, bounds){
    // 1. [Firestore 연동] 해당 병원의 ID로 등록된 메모가 있는지 비동기 조회
    let savedMemo = "";
    try {
      const docRef = doc(db, "hospital_memos", place.id);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        savedMemo = docSnap.data().content || "";
      }
    } catch (e) {
      console.error("Firestore 로드 에러:", e);
    }

    const markerColor = savedMemo ? "#2F80ED" : "#27AE60";
    const markerImage = createDotMarker(markerColor);

    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(place.y, place.x),
      image: markerImage
    });

    marker.setMap(map);
    markers.push(marker);

    bounds.extend(new kakao.maps.LatLng(place.y, place.x));

    // 클릭 시 동작 정의 공통화 함수
    async function handleSelectHospital() {
      currentHospital = place;
      selectedTitle.innerHTML = place.place_name;
      memoTextarea.value = "불러오는 중...";

      // 최신 데이터를 데이터베이스에서 실시간 호출
      try {
        const docRef = doc(db, "hospital_memos", place.id);
        const docSnap = await getDoc(docRef);
        memoTextarea.value = docSnap.exists() ? docSnap.data().content : "";
      } catch (e) {
        memoTextarea.value = "";
      }

      map.panTo(new kakao.maps.LatLng(place.y, place.x));
    }

    /* 마커 클릭 이벤트 */
    kakao.maps.event.addListener(marker, "click", handleSelectHospital);

    /* 목록 아이템 생성 및 클릭 이벤트 */
    const item = document.createElement("div");
    item.className = "hospital-item";
    item.innerHTML = `
      <div class="hospital-name">${place.place_name}</div>
      <div class="hospital-address">${place.address_name}</div>
    `;
    item.onclick = handleSelectHospital;
    hospitalList.appendChild(item);
  }

  /* 메모 저장 (Firestore 데이터 쓰기) */
  document.getElementById("saveBtn").onclick = async function(){
    if(!currentHospital){
      alert("병원을 선택하세요");
      return;
    }

    const textValue = memoTextarea.value;

    try {
      // 2. [Firestore 연동] hospital_memos 컬렉션에 병원 ID 문서로 저장
      await setDoc(doc(db, "hospital_memos", currentHospital.id), {
        name: currentHospital.place_name,
        content: textValue,
        updatedAt: new Date()
      });

      alert("서버 저장 완료 (모두에게 공유됩니다)");

      // 마커 색상 즉시 업데이트 (텍스트가 있을 때 파란색, 비었을 때 초록색)
      markers.forEach(marker => {
        const markerPos = marker.getPosition();
        // 소수점 유실로 인한 비교 실패 방지를 위해 고정 소수점 비교 처리
        if(
          markerPos.getLat().toFixed(6) === Number(currentHospital.y).toFixed(6) &&
          markerPos.getLng().toFixed(6) === Number(currentHospital.x).toFixed(6)
        ) {
          const nextColor = textValue.trim() ? "#2F80ED" : "#27AE60";
          marker.setImage(createDotMarker(nextColor));
        }
      });

    } catch (e) {
      console.error("Firestore 저장 실패: ", e);
      alert("저장에 실패했습니다. 설정을 확인해주세요.");
    }
  };

  /* 점 마커 생성 SVG */
  function createDotMarker(color){
    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18">
      <circle cx="9" cy="9" r="6" fill="${color}" stroke="white" stroke-width="2" />
    </svg>
    `;
    return new kakao.maps.MarkerImage(
      'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
      new kakao.maps.Size(18,18)
    );
  }

  // 전역 scope 연동을 위해 검색 함수를 window 객체 바인딩
  window.searchPlaces = searchPlaces;
</script>

</body>
</html>
