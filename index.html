<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이천 병원 지도</title>

<style>

html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:sans-serif;
}

/* 전체 */
#wrap{
  display:flex;
  width:100%;
  height:100%;
}

/* 왼쪽 영역 */
#topArea{
  width:340px;
  background:#fff;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
  z-index:10;
}

/* 검색 */
#searchArea{
  padding:14px;
  border-bottom:1px solid #eee;
  display:flex;
  gap:8px;
}

#keyword{
  flex:1;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#2f80ed;
  color:#fff;
  cursor:pointer;
}

/* 병원 목록 */
#hospitalList{
  flex:1;
  overflow-y:auto;
}

.hospital-item{
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.hospital-item:hover{
  background:#f5f7fa;
}

.hospital-name{
  font-weight:bold;
  margin-bottom:4px;
}

.hospital-address{
  font-size:13px;
  color:#666;
}

/* 지도 */
#map{
  flex:1;
  height:100%;
}

/* 메모 */
#memoPanel{
  width:320px;
  padding:14px;
  border-left:1px solid #ddd;
  background:#fafafa;
  box-sizing:border-box;
}

#selectedTitle{
  font-weight:bold;
  margin-bottom:8px;
}

#memo{
  width:100%;
  height:120px;
  resize:none;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  box-sizing:border-box;
}

#saveBtn{
  margin-top:10px;
  width:100%;
}

/* =========================
   모바일 UI
========================= */
@media (max-width:768px){

  html, body{
    overflow:hidden;
  }

  #wrap{
    flex-direction:column;
  }

  /* 상단 */
  #topArea{
    width:100%;
    height:230px;
    border-right:none;
    border-bottom:1px solid #ddd;
  }

  /* 검색 */
  #searchArea{
    display:flex;
    gap:8px;
    padding:10px;
    background:#fff;
  }

  #keyword{
    flex:1;
    font-size:16px;
    padding:12px;
  }

  button{
    font-size:15px;
    padding:12px 14px;
  }

  /* 목록 */
  #hospitalList{
    flex:1;
    overflow-y:auto;
    background:#fff;
  }

  .hospital-item{
    padding:14px;
  }

  .hospital-name{
    font-size:16px;
  }

  .hospital-address{
    font-size:14px;
  }

  /* 지도 */
  #map{
    flex:1;
    min-height:300px;
  }

  /* 메모 */
  #memoPanel{
    width:100%;
    border-left:none;
    border-top:1px solid #ddd;
    padding:12px;
    background:#fff;
  }

  #memo{
    height:90px;
    font-size:15px;
  }

}

</style>
</head>

<body>

<div id="wrap">

  <!-- 상단 -->
  <div id="topArea">

    <!-- 검색 -->
    <div id="searchArea">

      <input
        type="text"
        id="keyword"
        placeholder="병원 검색"
      />

      <button onclick="searchPlaces()">
        검색
      </button>

    </div>

    <!-- 병원 목록 -->
    <div id="hospitalList"></div>

  </div>

  <!-- 지도 -->
  <div id="map"></div>

  <!-- 메모 -->
  <div id="memoPanel">

    <div id="selectedTitle">
      병원을 선택하세요
    </div>

    <textarea
      id="memo"
      placeholder="병원 메모 입력"
    ></textarea>

    <button id="saveBtn">
      메모 저장
    </button>

  </div>

</div>

<!-- 카카오맵 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4106a0cc81c61ef4889c6d4acf55a48d&libraries=services"></script>

<script>

const ICHEON = {
  lat:37.2793,
  lng:127.4429
};

let map;
let ps;

let markers = [];

let currentHospital = null;

let myLocationMarker = null;

const hospitalList =
  document.getElementById("hospitalList");

const memoTextarea =
  document.getElementById("memo");

const selectedTitle =
  document.getElementById("selectedTitle");

/* 시작 */
window.onload = function(){

  map = new kakao.maps.Map(
    document.getElementById("map"),
    {
      center:new kakao.maps.LatLng(
        ICHEON.lat,
        ICHEON.lng
      ),
      level:5
    }
  );

  ps = new kakao.maps.services.Places();

  searchPlaces();

  showMyLocation();

};

/* 현재 위치 */
function showMyLocation(){

  if(!navigator.geolocation){
    return;
  }

  navigator.geolocation.watchPosition(

    function(position){

      if(position.coords.accuracy > 500){
        return;
      }

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      const myPos =
        new kakao.maps.LatLng(lat,lng);

      if(!myLocationMarker){

        const markerImage =
          createDotMarker("#FF3B30");

        myLocationMarker =
          new kakao.maps.Marker({
            position:myPos,
            image:markerImage,
            zIndex:9999
          });

        myLocationMarker.setMap(map);

      }else{

        myLocationMarker.setPosition(myPos);

      }

    },

    function(error){
      console.log(error);
    },

    {
      enableHighAccuracy:true,
      maximumAge:1000,
      timeout:15000
    }

  );

}

/* 마커 제거 */
function clearMarkers(){

  markers.forEach(marker=>{
    marker.setMap(null);
  });

  markers = [];
}

/* 병원 검색 */
async function searchPlaces(){

  clearMarkers();

  hospitalList.innerHTML = "";

  const bounds =
    new kakao.maps.LatLngBounds();

  const added = new Set();

  const keywords = [

    "이천 병원",
    "이천 의원",
    "이천 내과",
    "이천 외과",
    "이천 정형외과",
    "이천 신경외과",
    "이천 가정의학과",
    "이천 소아청소년과",
    "이천 안과",
    "이천 산부인과",
    "이천 이비인후과",
    "이천 클리닉"

  ];

  const userKeyword =
    document
    .getElementById("keyword")
    .value
    .trim()
    .toLowerCase();

  for(const keyword of keywords){

    await searchKeyword(
      keyword,
      added,
      bounds,
      userKeyword
    );

  }

  map.setBounds(bounds);

}

/* 검색 */
function searchKeyword(
  keyword,
  added,
  bounds,
  filterKeyword
){

  return new Promise((resolve)=>{

    ps.keywordSearch(

      keyword,

      function(data,status){

        if(
          status !==
          kakao.maps.services.Status.OK
        ){
          resolve();
          return;
        }

        data.forEach(place=>{

          const name =
            place.place_name;

          /* 제외 */
          if(
            name.includes("약국") ||
            name.includes("동물") ||
            name.includes("주차장") ||
            name.includes("장례") ||
            name.includes("요양")
          ){
            return;
          }

          /* 필터 */
          if(
            filterKeyword &&
            !name.toLowerCase()
            .includes(filterKeyword)
          ){
            return;
          }

          /* 중복 제거 */
          if(added.has(place.id)){
            return;
          }

          added.add(place.id);

          addHospital(place,bounds);

        });

        resolve();

      },

      {
        location:new kakao.maps.LatLng(
          ICHEON.lat,
          ICHEON.lng
        ),
        radius:10000,
        size:15
      }

    );

  });

}

/* 병원 추가 */
function addHospital(place,bounds){

  const savedMemo =
    localStorage.getItem(place.id);

  const markerColor =
    savedMemo ? "#2F80ED" : "#27AE60";

  const markerImage =
    createDotMarker(markerColor);

  const marker =
    new kakao.maps.Marker({

      position:new kakao.maps.LatLng(
        place.y,
        place.x
      ),

      image:markerImage

    });

  marker.setMap(map);

  markers.push(marker);

  bounds.extend(
    new kakao.maps.LatLng(
      place.y,
      place.x
    )
  );

  /* 마커 클릭 */
  kakao.maps.event.addListener(
    marker,
    "click",
    function(){

      currentHospital = place;

      selectedTitle.innerHTML =
        place.place_name;

      memoTextarea.value =
        localStorage.getItem(place.id)
        || "";

      map.panTo(
        new kakao.maps.LatLng(
          place.y,
          place.x
        )
      );

    }
  );

  /* 목록 */
  const item =
    document.createElement("div");

  item.className = "hospital-item";

  item.innerHTML = `
    <div class="hospital-name">
      ${place.place_name}
    </div>

    <div class="hospital-address">
      ${place.address_name}
    </div>
  `;

  item.onclick = function(){

    currentHospital = place;

    selectedTitle.innerHTML =
      place.place_name;

    memoTextarea.value =
      localStorage.getItem(place.id)
      || "";

    map.panTo(
      new kakao.maps.LatLng(
        place.y,
        place.x
      )
    );

  };

  hospitalList.appendChild(item);

}

/* 메모 저장 */
document
.getElementById("saveBtn")
.onclick = function(){

  if(!currentHospital){
    alert("병원을 선택하세요");
    return;
  }

  localStorage.setItem(
    currentHospital.id,
    memoTextarea.value
  );

  alert("저장 완료");

  markers.forEach(marker=>{

    const markerPos =
      marker.getPosition();

    if(
      markerPos.getLat() == currentHospital.y &&
      markerPos.getLng() == currentHospital.x
    ){

      const blueMarker =
        createDotMarker("#2F80ED");

      marker.setImage(blueMarker);

    }

  });

};

/* 점 마커 */
function createDotMarker(color){

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="18"
       height="18">

    <circle
      cx="9"
      cy="9"
      r="6"
      fill="${color}"
      stroke="white"
      stroke-width="2"
    />

  </svg>
  `;

  return new kakao.maps.MarkerImage(

    'data:image/svg+xml;charset=UTF-8,' +
    encodeURIComponent(svg),

    new kakao.maps.Size(18,18)

  );

}

</script>

</body>
</html>
