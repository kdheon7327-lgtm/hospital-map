<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이천 병원 지도 (공유 메모 & 내 위치)</title>

<style>
html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:sans-serif;
}

/* 전체 구조 */
#wrap{
  display:flex;
  width:100%;
  height:100%;
}

/* 왼쪽 영역 */
#topArea{
  width:340px;
  background:#fff;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
  z-index:10;
}

/* 검색 */
#searchArea{
  padding:14px;
  border-bottom:1px solid #eee;
  display:flex;
  gap:8px;
}

#keyword{
  flex:1;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#2f80ed;
  color:#fff;
  cursor:pointer;
}

/* 병원 목록 */
#hospitalList{
  flex:1;
  overflow-y:auto;
}

.hospital-item{
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.hospital-item:hover{
  background:#f5f7fa;
}

.hospital-name{
  font-weight:bold;
  margin-bottom:4px;
}

.hospital-address{
  font-size:13px;
  color:#666;
}

/* [수정] 지도 영역 및 내위치 버튼을 함께 담는 컨테이너 */
#mapContainer {
  flex:1;
  height:100%;
  position: relative; /* 자식 요소인 버튼의 뼈대가 됨 */
}

#map{
  width:100%;
  height:100%;
}

/* [추가] 내 위치로 이동 버튼 스타일 */
#myLocationBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 9999; /* 마커보다 위에 오도록 설정 */
  background: #ffffff;
  color: #333333;
  border: 1px solid #dddddd;
  padding: 12px 16px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
#myLocationBtn:hover {
  background: #f5f5f5;
}

/* 메모 Panel */
#memoPanel{
  width:320px;
  padding:14px;
  border-left:1px solid #ddd;
  background:#fafafa;
  box-sizing:border-box;
}

#selectedTitle{
  font-weight:bold;
  margin-bottom:8px;
}

#memo{
  width:100%;
  height:120px;
  resize:none;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  box-sizing:border-box;
}

#saveBtn{
  margin-top:10px;
  width:100%;
}

/* =========================
   모바일 UI (화면 폭 768px 이하)
========================= */
@media (max-width:768px){
  html, body{
    overflow:hidden;
  }

  #wrap{
    flex-direction:column;
  }

  /* 상단 영역 고정 높이 */
  #topArea{
    width:100%;
    height:230px;
    border-right:none;
    border-bottom:1px solid #ddd;
  }

  #searchArea{
    display:flex;
    gap:8px;
    padding:10px;
    background:#fff;
  }

  #keyword{
    flex:1;
    font-size:16px;
    padding:12px;
  }

  button{
    font-size:15px;
    padding:12px 14px;
  }

  #hospitalList{
    height:160px;
    overflow-y:auto;
    background:#fff;
  }

  /* [수정] 모바일 화면에서 지도 컨테이너 배치 설정 */
  #mapContainer{
    flex:1;
    width: 100%;
    min-height:250px;
    position: relative;
  }

  /* [수정] 모바일 최적화 버튼 위치 조정 */
  #myLocationBtn {
    bottom: 15px;
    right: 15px;
    padding: 10px 14px;
    font-size: 13px;
  }

  /* 하단 메모 영역 */
  #memoPanel{
    width:100%;
    border-left:none;
    border-top:1px solid #ddd;
    padding:12px;
    background:#fff;
  }

  #memo{
    height:90px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="wrap">
  <div id="topArea">
    <div id="searchArea">
      <input type="text" id="keyword" placeholder="병원 검색" />
      <button onclick="searchPlaces()">검색</button>
    </div>
    <div id="hospitalList"></div>
  </div>

  <div id="mapContainer">
    <div id="map"></div>
    <button id="myLocationBtn" onclick="panToMyLocation()">📍 내 위치</button>
  </div>

  <div id="memoPanel">
    <div id="selectedTitle">병원을 선택하세요</div>
    <textarea id="memo" placeholder="병원 메모 입력 (모두에게 공유됩니다)"></textarea>
    <button id="saveBtn">메모 저장</button>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4106a0cc81c61ef4889c6d4acf55a48d&libraries=services"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // TODO: 본인의 Firebase 프로젝트 설정 정보로 반드시 변경하세요!
  const firebaseConfig = {
    apiKey: "AIzaSyDXygjMEH5dTXEnShy5RtEe3TNuGg4HWNo",
    authDomain: "icheonhospitalmap.firebaseapp.com",
    projectId: "icheonhospitalmap",
    storageBucket: "icheonhospitalmap.firebasestorage.app",
    messagingSenderId: "101383699939",
    appId: "1:101383699939:web:810bff2eeff22d9433b4d6",
    measurementId: "G-W85K5CQ01Y"
  };

  // Firebase 초기화
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ICHEON = { lat:37.2793, lng:127.4429 };
  let map;
  let ps;
  let markers = [];
  let currentHospital = null;
  
  // 내 위치 관리 변수
  let myLocationMarker = null;
  let lastKnownMyPos = null; 

  const hospitalList = document.getElementById("hospitalList");
  const memoTextarea = document.getElementById("memo");
  const selectedTitle = document.getElementById("selectedTitle");

  /* 앱 실행 시 초기화 */
  window.onload = function(){
    map = new kakao.maps.Map(
      document.getElementById("map"),
      {
        center: new kakao.maps.LatLng(ICHEON.lat, ICHEON.lng),
        level: 5
      }
    );

    ps = new kakao.maps.services.Places();
    searchPlaces();
    startTrackingLocation(); // 실시간 위치 추적 시작
  };

  /* 실시간 내 위치 추적 (watchPosition) */
  function startTrackingLocation(){
    if(!navigator.geolocation) {
      console.log("GPS 기능을 지원하지 않는 브라우저입니다.");
      return;
    }

    navigator.geolocation.watchPosition(
      function(position){
        if(position.coords.accuracy > 500) return; // 오차가 너무 큰 신호 무시

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        
        lastKnownMyPos = new kakao.maps.LatLng(lat, lng);

        // 지도 상에 내 위치 빨간 점 표시
        if(!myLocationMarker){
          const markerImage = createDotMarker("#FF3B30"); 
          myLocationMarker = new kakao.maps.Marker({
            position: lastKnownMyPos,
            image: markerImage,
            zIndex: 9999
          });
          myLocationMarker.setMap(map);
        } else {
          myLocationMarker.setPosition(lastKnownMyPos);
        }
      },
      function(error){ 
        console.error("위치 추적 실패:", error); 
      },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
    );
  }

  /* 내 위치 버튼 클릭 이벤트 */
  function panToMyLocation() {
    if (lastKnownMyPos) {
      map.panTo(lastKnownMyPos);
    } else {
      alert("아직 현재 위치를 가져오는 중이거나, 브라우저 위치 권한이 꺼져 있습니다.");
    }
  }

  /* 마커 리셋 */
  function clearMarkers(){
    markers.forEach(marker => { marker.setMap(null); });
    markers = [];
  }

  /* 병원 카테고리 검색 수행 */
  async function searchPlaces(){
    clearMarkers();
    hospitalList.innerHTML = "";

    const bounds = new kakao.maps.LatLngBounds();
    const added = new Set();
    const keywords = [
      "이천 병원", "이천 의원", "이천 내과", "이천 외과", "이천 정형외과", 
      "이천 신경외과", "이천 가정의학과", "이천 소아청소년과", "이천 안과", 
      "이천 산부인과", "이천 이비인후과", "이천 클리닉"
    ];

    const userKeyword = document.getElementById("keyword").value.trim().toLowerCase();

    for(const keyword of keywords){
      await searchKeyword(keyword, added, bounds, userKeyword);
    }
    map.setBounds(bounds);
  }

  /* 키워드별 검색 및 필터링 */
  function searchKeyword(keyword, added, bounds, filterKeyword){
    return new Promise((resolve) => {
      ps.keywordSearch(
        keyword,
        async function(data, status){
          if(status !== kakao.maps.services.Status.OK){
            resolve();
            return;
          }

          for (const place of data) {
            const name = place.place_name;
            // 필터링 제외 조건들
            if(name.includes("약국") || name.includes("동물") || name.includes("주차장") || name.includes("장례") || name.includes("요양")){
              continue;
            }
            if(filterKeyword && !name.toLowerCase().includes(filterKeyword)){
              continue;
            }
            if(added.has(place.id)){
              continue;
            }

            added.add(place.id);
            await addHospital(place, bounds);
          }
          resolve();
        },
        {
          location: new kakao.maps.LatLng(ICHEON.lat, ICHEON.lng),
          radius: 10000,
          size: 15
        }
      );
    });
  }

  /* 지도 및 리스트에 병원 데이터 주입 및 마커 색 결정 */
  async function addHospital(place, bounds){
    let savedMemo = "";
    try {
      // Firestore에서 기존 작성 기록 유무 조회
      const docRef = doc(db, "hospital_memos", place.id);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        savedMemo = docSnap.data().content || "";
      }
    } catch (e) {
      console.error("데이터 로드 실패:", e);
    }

    // 메모 유무에 따라 마커 색 변경 (있으면 블루, 없으면 그린)
    const markerColor = savedMemo ? "#2F80ED" : "#27AE60";
    const markerImage = createDotMarker(markerColor);

    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(place.y, place.x),
      image: markerImage
    });

    marker.setMap(map);
    markers.push(marker);

    bounds.extend(new kakao.maps.LatLng(place.y, place.x));

    // 마커/목록 공통 선택 처리 함수
    async function handleSelectHospital() {
      currentHospital = place;
      selectedTitle.innerHTML = place.place_name;
      memoTextarea.value = "메모 불러오는 중...";

      try {
        const docRef = doc(db, "hospital_memos", place.id);
        const docSnap = await getDoc(docRef);
        memoTextarea.value = docSnap.exists() ? docSnap.data().content : "";
      } catch (e) {
        memoTextarea.value = "";
      }

      map.panTo(new kakao.maps.LatLng(place.y, place.x));
    }

    kakao.maps.event.addListener(marker, "click", handleSelectHospital);

    const item = document.createElement("div");
    item.className = "hospital-item";
    item.innerHTML = `
      <div class="hospital-name">${place.place_name}</div>
      <div class="hospital-address">${place.address_name}</div>
    `;
    item.onclick = handleSelectHospital;
    hospitalList.appendChild(item);
  }

  /* 메모 저장 및 DB 업로드 (Firestore setDoc) */
  document.getElementById("saveBtn").onclick = async function(){
    if(!currentHospital){
      alert("병원을 선택하세요");
      return;
    }

    const textValue = memoTextarea.value;

    try {
      await setDoc(doc(db, "hospital_memos", currentHospital.id), {
        name: currentHospital.place_name,
        content: textValue,
        updatedAt: new Date()
      });

      alert("서버 저장 완료! 데이터가 모두에게 공유됩니다.");

      // 마커 색상 실시간 업데이트 처리
      markers.forEach(marker => {
        const markerPos = marker.getPosition();
        if(
          markerPos.getLat().toFixed(6) === Number(currentHospital.y).toFixed(6) &&
          markerPos.getLng().toFixed(6) === Number(currentHospital.x).toFixed(6)
        ) {
          const nextColor = textValue.trim() ? "#2F80ED" : "#27AE60";
          marker.setImage(createDotMarker(nextColor));
        }
      });

    } catch (e) {
      console.error("DB 저장 에러:", e);
      alert("저장에 실패했습니다. 권한 및 주소를 확인해 주세요.");
    }
  };

  /* 원형 SVG 점 마커 생성기 */
  function createDotMarker(color){
    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18">
      <circle cx="9" cy="9" r="6" fill="${color}" stroke="white" stroke-width="2" />
    </svg>
    `;
    return new kakao.maps.MarkerImage(
      'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
      new kakao.maps.Size(18,18)
    );
  }

  // 전역 scope(onclick 등 HTML 속성 구문) 호출 연동을 위한 함수 바인딩
  window.searchPlaces = searchPlaces;
  window.panToMyLocation = panToMyLocation;
</script>

</body>
</html>
