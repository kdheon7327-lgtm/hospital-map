<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이천 병원 지도</title>

<style>

html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:sans-serif;
}

#wrap{
  display:flex;
  width:100%;
  height:100%;
}

#sidebar{
  width:340px;
  background:#fff;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
  z-index:10;
}

#searchArea{
  padding:14px;
  border-bottom:1px solid #eee;
}

#keyword{
  width:180px;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  padding:8px 10px;
  border:none;
  border-radius:6px;
  background:#2f80ed;
  color:#fff;
  cursor:pointer;
  margin-top:5px;
}

#hospitalList{
  flex:1;
  overflow-y:auto;
}

.hospital-item{
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.hospital-item:hover{
  background:#f5f7fa;
}

.hospital-name{
  font-weight:bold;
}

.hospital-address{
  font-size:13px;
  color:#666;
}

#memoPanel{
  padding:14px;
  border-top:1px solid #ddd;
  background:#fafafa;
}

#memo{
  width:100%;
  height:120px;
  padding:10px;
  resize:none;
  box-sizing:border-box;
}

#map{
  flex:1;
  height:100%;
}

.info{
  margin-top:8px;
  font-size:13px;
  color:#444;
}

</style>
</head>

<body>

<div id="wrap">

  <div id="sidebar">

    <div id="searchArea">

      <input
        type="text"
        id="keyword"
        placeholder="병원 검색"
      />

      <button onclick="searchPlaces()">
        검색
      </button>

      <button onclick="moveToMyLocation()">
        현재 위치
      </button>

      <button onclick="findNearestHospital()">
        가장 가까운 병원
      </button>

      <div class="info" id="gpsInfo">
        GPS 방향: -
      </div>

    </div>

    <div id="hospitalList"></div>

    <div id="memoPanel">

      <div id="selectedTitle">
        병원을 선택하세요
      </div>

      <textarea
        id="memo"
        placeholder="메모 입력"
      ></textarea>

      <button id="saveBtn">
        메모 저장
      </button>

    </div>

  </div>

  <div id="map"></div>

</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4106a0cc81c61ef4889c6d4acf55a48d&libraries=services"></script>

<script>

/* =========================
   이천 중심
========================= */

const ICHEON = {
  lat:37.2793,
  lng:127.4429
};

let map;
let ps;

let markers = [];
let hospitals = [];

let currentHospital = null;

let myLocation = null;
let myLocationMarker = null;
let myCircle = null;

const hospitalList =
  document.getElementById("hospitalList");

const memoTextarea =
  document.getElementById("memo");

const selectedTitle =
  document.getElementById("selectedTitle");

/* =========================
   시작
========================= */

window.onload = function(){

  map = new kakao.maps.Map(
    document.getElementById("map"),
    {
      center:new kakao.maps.LatLng(
        ICHEON.lat,
        ICHEON.lng
      ),
      level:5
    }
  );

  ps =
    new kakao.maps.services.Places();

  searchPlaces();

  showMyLocation();

  startCompass();

};

/* =========================
   현재 위치 표시
========================= */

function showMyLocation(){

  if(!navigator.geolocation){
    return;
  }

  navigator.geolocation.watchPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      myLocation = {
        lat,
        lng
      };

      const pos =
        new kakao.maps.LatLng(lat,lng);

      const markerImage =
        createBlinkMarker();

      /* 첫 생성 */
      if(!myLocationMarker){

        myLocationMarker =
          new kakao.maps.Marker({
            position:pos,
            image:markerImage,
            zIndex:9999
          });

        myLocationMarker.setMap(map);

      }else{

        myLocationMarker.setPosition(pos);

      }

      /* 자동 이동 */
      map.panTo(pos);

      /* 반경 표시 */
      if(myCircle){
        myCircle.setMap(null);
      }

      myCircle =
        new kakao.maps.Circle({

          center:pos,

          radius:1000,

          strokeWeight:2,

          strokeColor:"#FF3B30",

          strokeOpacity:0.8,

          fillColor:"#FF3B30",

          fillOpacity:0.1

        });

      myCircle.setMap(map);

    },

    function(error){
      console.log(error);
    },

    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:5000
    }

  );

}

/* =========================
   현재 위치 버튼
========================= */

function moveToMyLocation(){

  if(!myLocation){
    return;
  }

  map.panTo(
    new kakao.maps.LatLng(
      myLocation.lat,
      myLocation.lng
    )
  );
}

/* =========================
   병원 검색
========================= */

async function searchPlaces(){

  clearMarkers();

  hospitalList.innerHTML = "";

  hospitals = [];

  const bounds =
    new kakao.maps.LatLngBounds();

  const added =
    new Set();

  const keywords = [

    "이천 병원",
    "이천 의원",
    "이천 내과",
    "이천 외과",
    "이천 정형외과",
    "이천 소아과",
    "이천 안과",
    "이천 이비인후과"

  ];

  const userKeyword =
    document
    .getElementById("keyword")
    .value
    .trim()
    .toLowerCase();

  for(const keyword of keywords){

    await searchKeyword(
      keyword,
      added,
      bounds,
      userKeyword
    );
  }

  if(markers.length > 0){
    map.setBounds(bounds);
  }
}

/* =========================
   키워드 검색
========================= */

function searchKeyword(
  keyword,
  added,
  bounds,
  filterKeyword
){

  return new Promise((resolve)=>{

    ps.keywordSearch(

      keyword,

      function(data,status){

        if(
          status !==
          kakao.maps.services.Status.OK
        ){
          resolve();
          return;
        }

        data.forEach(place=>{

          const name =
            place.place_name;

          /* 제외 */
          if(
            name.includes("약국") ||
            name.includes("동물") ||
            name.includes("요양") ||
            name.includes("한의원")||
            name.includes("응급")||
            name.includes("주차장")
          ){
            return;
          }

          /* 검색 */
          if(
            filterKeyword &&
            !name
            .toLowerCase()
            .includes(filterKeyword)
          ){
            return;
          }

          if(added.has(place.id)){
            return;
          }

          added.add(place.id);

          addHospital(place,bounds);

        });

        resolve();

      },

      {
        location:
          new kakao.maps.LatLng(
            ICHEON.lat,
            ICHEON.lng
          ),

        radius:10000,

        size:15
      }

    );

  });

}

/* =========================
   병원 추가
========================= */

function addHospital(place,bounds){

  hospitals.push(place);

  const savedMemo =
    localStorage.getItem(place.id);

  const color =
    savedMemo
    ? "#2F80ED"
    : "#27AE60";

  const markerImage =
    createDotMarker(color);

  const marker =
    new kakao.maps.Marker({

      position:
        new kakao.maps.LatLng(
          place.y,
          place.x
        ),

      image:markerImage

    });

  marker.setMap(map);

  markers.push(marker);

  bounds.extend(
    new kakao.maps.LatLng(
      place.y,
      place.x
    )
  );

  kakao.maps.event.addListener(
    marker,
    "click",
    function(){

      currentHospital = place;

      selectedTitle.innerHTML =
        place.place_name;

      memoTextarea.value =
        localStorage.getItem(place.id)
        || "";

      map.panTo(
        new kakao.maps.LatLng(
          place.y,
          place.x
        )
      );

    }
  );

  const item =
    document.createElement("div");

  item.className =
    "hospital-item";

  item.innerHTML = `
    <div class="hospital-name">
      ${place.place_name}
    </div>

    <div class="hospital-address">
      ${place.address_name}
    </div>
  `;

  item.onclick = function(){

    currentHospital = place;

    selectedTitle.innerHTML =
      place.place_name;

    memoTextarea.value =
      localStorage.getItem(place.id)
      || "";

    map.panTo(
      new kakao.maps.LatLng(
        place.y,
        place.x
      )
    );

  };

  hospitalList.appendChild(item);

}

/* =========================
   메모 저장
========================= */

document
.getElementById("saveBtn")
.onclick = function(){

  if(!currentHospital){
    return;
  }

  localStorage.setItem(
    currentHospital.id,
    memoTextarea.value
  );

  alert("저장 완료");

};

/* =========================
   가장 가까운 병원 찾기
========================= */

function findNearestHospital(){

  if(!myLocation){
    return;
  }

  let nearest = null;
  let minDistance = Infinity;

  hospitals.forEach(hospital=>{

    const dist =
      getDistance(

        myLocation.lat,
        myLocation.lng,

        parseFloat(hospital.y),
        parseFloat(hospital.x)

      );

    if(dist < minDistance){

      minDistance = dist;

      nearest = hospital;

    }

  });

  if(nearest){

    alert(
      "가장 가까운 병원:\n" +
      nearest.place_name +
      "\n거리: " +
      Math.round(minDistance) +
      "m"
    );

    map.panTo(
      new kakao.maps.LatLng(
        nearest.y,
        nearest.x
      )
    );

  }

}

/* =========================
   거리 계산
========================= */

function getDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371e3;

  const p1 =
    lat1 * Math.PI/180;

  const p2 =
    lat2 * Math.PI/180;

  const dp =
    (lat2-lat1) * Math.PI/180;

  const dl =
    (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dp/2) *
    Math.sin(dp/2) +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(dl/2) *
    Math.sin(dl/2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R * c;
}

/* =========================
   GPS 방향 표시
========================= */

function startCompass(){

  if(
    window.DeviceOrientationEvent
  ){

    window.addEventListener(

      "deviceorientation",

      function(event){

        const heading =
          Math.round(
            event.alpha || 0
          );

        document
        .getElementById("gpsInfo")
        .innerHTML =
          "GPS 방향: " +
          heading + "°";

      }

    );

  }

}

/* =========================
   마커 제거
========================= */

function clearMarkers(){

  markers.forEach(marker=>{
    marker.setMap(null);
  });

  markers = [];
}

/* =========================
   일반 점 마커
========================= */

function createDotMarker(color){

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="18"
       height="18">

    <circle
      cx="9"
      cy="9"
      r="6"
      fill="${color}"
      stroke="white"
      stroke-width="2"
    />

  </svg>
  `;

  return new kakao.maps.MarkerImage(

    'data:image/svg+xml;charset=UTF-8,' +
    encodeURIComponent(svg),

    new kakao.maps.Size(18,18)

  );
}

/* =========================
   깜빡이는 빨간 마커
========================= */

function createBlinkMarker(){

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="24"
       height="24">

    <circle
      cx="12"
      cy="12"
      r="8"
      fill="#FF3B30"
      opacity="0.9"
    >

      <animate
        attributeName="opacity"
        values="1;0.2;1"
        dur="1s"
        repeatCount="indefinite"
      />

    </circle>

  </svg>
  `;

  return new kakao.maps.MarkerImage(

    'data:image/svg+xml;charset=UTF-8,' +
    encodeURIComponent(svg),

    new kakao.maps.Size(24,24)

  );
}

</script>

</body>
</html>
